<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fef3c7; margin:0; }
    .card { background: white; padding: 32px; border-radius: 18px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); text-align: center; max-width: 420px; }
    h1 { color: #b45309; margin-bottom: 16px; }
    p { color: #92400e; line-height: 1.6; }
    a { display: inline-block; margin-top: 24px; padding: 12px 24px; border-radius: 10px; background: #f59e0b; color: white; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚠️ Payment Cancelled</h1>
    <p>You cancelled the checkout process. You can go back and try again when you are ready.</p>
    <a href="/">Return to Game Creator</a>
  </div>
</body>
</html>
